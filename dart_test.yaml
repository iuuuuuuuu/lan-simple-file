# 全量测试串行执行。
#
# 原因（实测，不是保守估计）：本仓库的 e2e 用例会绑定**真实** UDP 端口并依赖
# 广播/组播发现。多个测试文件并行时会互相串包——UDP 绑定用 reuseAddress=true，
# 两个 socket 绑同一端口**都会成功并且都收包**，于是 A 用例会收到 B 用例的帧
# （实测现象：群聊帧被别的测试节点收到，报「群聊已解散或你已退出」）。
#
# 该问题在全量并行时稳定复现、单独运行必过，属确定性隔离缺陷，不是随机抖动。
# 串行后每个文件独占真实网络，结果确定。不要为了跑得快把 concurrency 调高：
# 那样会重新引入串包，表现为「随机某条 e2e 红」，非常难查。
concurrency: 1
