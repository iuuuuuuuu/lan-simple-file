<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>lan-simple-file</title>
    <link rel="stylesheet" href="/web/style.css" />
  </head>
  <body class="catalog-page">
    <!-- Lucide icons, ISC License. Copyright (c) 2026 Lucide Icons and Contributors.
    Permission to use, copy, modify, and/or distribute this software for any
    purpose with or without fee is hereby granted, provided that the above
    copyright notice and this permission notice appear in all copies.
    THE SOFTWARE IS PROVIDED "AS IS" AND THE AUTHOR DISCLAIMS ALL WARRANTIES
    WITH REGARD TO THIS SOFTWARE INCLUDING ALL IMPLIED WARRANTIES OF
    MERCHANTABILITY AND FITNESS. IN NO EVENT SHALL THE AUTHOR BE LIABLE FOR
    ANY SPECIAL, DIRECT, INDIRECT, OR CONSEQUENTIAL DAMAGES OR ANY DAMAGES

    ACTION OF CONTRACT, NEGLIGENCE OR OTHER TORTIOUS ACTION, ARISING OUT OF
    OR IN CONNECTION WITH THE USE OR PERFORMANCE OF THIS SOFTWARE. -->
    <main class="catalog-shell">
      <header class="catalog-header">
        <img id="owner-avatar" class="catalog-avatar" alt="分享者头像" width="48" height="48" hidden />
        <div class="catalog-owner">
          <h1 id="catalog-title">我的分享</h1>
          <p id="catalog-domain" class="mono"></p>
        </div>
        <button class="catalog-icon-button" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2v2" /><path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715" /><path d="M16 12a4 4 0 0 0-4-4" /><path d="m19 5-1.256 1.256" /><path d="M20 12h2" /></svg>
        </button>
      </header>
      <div class="catalog-tools">
        <input id="share-search" type="search" placeholder="搜索分享" aria-label="搜索分享" autocomplete="off" />
        <button class="catalog-icon-button" id="refresh" type="button" aria-label="刷新分享" title="刷新分享">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg>
        </button>
      </div>
      <label class="catalog-group-filter" id="group-filter" hidden>
        <span>分组</span>
        <select id="share-group" aria-label="分享分组"></select>
      </label>
      <p class="hint catalog-status" id="status" role="status" aria-live="polite">正在读取分享…</p>
      <ul class="catalog-list" id="shared-roots" aria-label="分享列表"></ul>
      <p class="catalog-empty" id="empty-state" hidden></p>
      <footer class="foot">
        <span>lan-simple-file</span>
        <span>GPL-3.0-only</span>
      </footer>
    </main>
    <template id="catalog-folder-icon">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg>
    </template>
    <template id="catalog-file-icon">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5" /></svg>
    </template>
    <script src="/web/app.js" defer></script>
  </body>
</html>
