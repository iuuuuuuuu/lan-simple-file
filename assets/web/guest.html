<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>网页访客 · lan-simple-file</title>
    <link rel="stylesheet" href="/web/style.css" />
    <link rel="stylesheet" href="/web/guest.css" />
  </head>
  <body class="guest">
    <main class="shell">
      <header class="bar">
        <span class="dot" id="feed-dot" aria-hidden="true"></span>
        <h1 class="title">网页访客</h1>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换明暗主题">
          <span id="theme-label">跟随系统</span>
        </button>
      </header>

      <section class="card">
        <p class="row"><span class="k">会话</span><span class="v mono" id="session-id">尚未建立</span></p>
        <p class="row"><span class="k">宿主</span><span class="v mono" id="host-peer">…</span></p>
        <p class="row"><span class="k">配额</span><span class="v" id="quota">…</span></p>
      </section>

      <section class="card">
        <p class="hint" id="status">正在与宿主节点握手…</p>
      </section>

      <section class="card">
        <h2 class="sub">发送文件</h2>
        <p class="hint">
          发送前必须由接收方点「接受」。未接受时不会上传任何一个字节。
        </p>
        <p><button class="primary" id="pick" type="button">选择文件并请求授权</button></p>
        <input type="file" id="file" hidden />
        <p class="hint" id="upload-status"></p>
      </section>

      <footer class="foot">
        <span>GPL-3.0-only</span>
        <span>关闭本页面即结束会话</span>
      </footer>
    </main>
    <script src="/web/guest.js" defer></script>
  </body>
</html>
